<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="目標ツリー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>目標ツリー改訂版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 方眼ノートの上に、今日のノルマ → 目標ツリー → 課題 をタブで切り替える1カラムのアプリ */
:root {
  --bg: #F2F5F4; --grid: rgba(14,124,102,.06); --surface: #FFFFFF; --ink: #15212A; --muted: #5B6A72;
  --line: #DAE2E0; --accent: #0E7C66; --accent-ink: #FFFFFF; --accent-soft: #DCF0EA;
  --mark: #E9B726; --mark-soft: #FCF1CF; --warn: #C2410C; --warn-soft: #FCE6DA; --ok: #15803D; --ok-soft: #DCF3E3;
  --s-mat: #00876A; --s-task: #5B6FD6; --s-asg: #B98500;
  --tree-off: #BCC4C2; --tree-on: #2F9E55; --trunk-off: #A4AAA8; --trunk-on: #8A5A35;
  --shadow: 0 1px 2px rgba(21,33,42,.06), 0 4px 14px rgba(21,33,42,.06);
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --tree-off: #4B5755; --tree-on: #45C46E; --trunk-off: #5C6563; --trunk-on: #A8764C;
  --s-mat: #1E9C7D; --s-task: #7A88F2; --s-asg: #B48A22;
  --bg: #0E1416; --grid: rgba(60,198,164,.05); --surface: #162024; --ink: #E5EEEC; --muted: #93A39F;
  --line: #26353A; --accent: #3CC6A4; --accent-ink: #062018; --accent-soft: #123A31;
  --mark: #E6BE52; --mark-soft: #382F1A; --warn: #F2925F; --warn-soft: #3B2418; --ok: #4ADE80; --ok-soft: #133524;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --tree-off: #4B5755; --tree-on: #45C46E; --trunk-off: #5C6563; --trunk-on: #A8764C;
  --s-mat: #1E9C7D; --s-task: #7A88F2; --s-asg: #B48A22;
  --bg: #0E1416; --grid: rgba(60,198,164,.05); --surface: #162024; --ink: #E5EEEC; --muted: #93A39F;
  --line: #26353A; --accent: #3CC6A4; --accent-ink: #062018; --accent-soft: #123A31;
  --mark: #E6BE52; --mark-soft: #382F1A; --warn: #F2925F; --warn-soft: #3B2418; --ok: #4ADE80; --ok-soft: #133524;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* ロードマップ */
.rm-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.rm { --labw: 158px; position: relative; }
@media (min-width: 640px) { .rm { --labw: 210px; } }
.rm-head, .rm-row { display: flex; height: 42px; }
.rm-head { height: 40px; border-bottom: 1px solid var(--line); }
.rm-row { border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.rm-row.root { border-top: 1px solid var(--line); }
.rm-row.grp { height: 34px; border-top: 1px solid var(--line); }
.rm-lab { position: sticky; left: 0; z-index: 3; flex: none; width: var(--labw); background: var(--surface); border-right: 1px solid var(--line); display: flex; align-items: center; gap: 4px; padding-right: 6px; min-width: 0; }
.rm-lab { padding-left: 8px; }
.rm-lab .ind { flex: none; }
/* 名前の列では、行の区切り線のすき間から背景（休みの斜線など）が見えないように、線も自分で描く */
.rm-row > .rm-lab { margin-bottom: -1px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, var(--surface)); }
.rm-row.root > .rm-lab, .rm-row.grp > .rm-lab { margin-top: -1px; border-top: 1px solid var(--line); }
.rm-lab.corner { padding-left: 10px; }
.ic.task { color: var(--s-task); }
.rm-lab .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; }
.rm-lab.sub .t { font-weight: 500; }
.rm-lab.done .t { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
.rm-row.grp .rm-lab { background: var(--bg); padding-left: 8px; }
.rm-row.grp .t { cursor: default; color: var(--muted); }
.rm-lab .tw { width: 22px; height: 22px; border: 0; background: transparent; padding: 0; display: grid; place-items: center; color: var(--muted); flex: none; }
.rm-lab .tw svg { width: 15px; height: 15px; transition: transform .15s; }
.rm-lab .tw.open svg { transform: rotate(90deg); }
.rm-lab .ic { width: 22px; display: grid; place-items: center; flex: none; }
.rm-lab .ic svg { width: 16px; height: 16px; }
.ic.material { color: var(--s-mat); } .ic.asg { color: var(--s-asg); }
.check.mini { width: 20px; height: 20px; border-radius: 6px; margin: 0 1px; }
.check.mini svg { width: 12px; height: 12px; }
.rm-track, .rm-scale { position: relative; flex: none; }
.rm-body { position: relative; }
.rm-grid { position: absolute; top: 0; bottom: 0; left: var(--labw); pointer-events: none; }
.rm-grid i { position: absolute; top: 0; bottom: 0; }
.rm-grid .mline { width: 1px; background: var(--line); }
.rm-grid .wkend { background: color-mix(in srgb, var(--line) 35%, transparent); }
.rm-grid .offr { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warn) 14%, transparent) 0 5px, transparent 5px 11px); }
.rm-grid .today { width: 2px; background: var(--ink); opacity: .75; }
.rm-scale .mon { position: absolute; top: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; padding-left: 5px; }
.rm-scale .day { position: absolute; bottom: 3px; font-size: 10px; color: var(--muted); font-family: var(--font-num); transform: translateX(-50%); }
.rm-scale .tdy { position: absolute; bottom: 2px; z-index: 1; font-size: 10.5px; font-weight: 700; background: var(--ink); color: var(--surface); border-radius: 4px; padding: 0 4px; transform: translateX(-50%); white-space: nowrap; }
.rm-scale .offl { position: absolute; top: 3px; font-size: 10.5px; color: var(--warn); white-space: nowrap; margin-left: 40px; }
.rm-bar { position: absolute; top: 14px; height: 14px; border-radius: 4px; overflow: hidden; cursor: pointer; border: 0; padding: 0; }
.rm-bar > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
.rm-bar.mat { background: color-mix(in srgb, var(--s-mat) 22%, var(--surface)); }
.rm-bar.mat > i { background: var(--s-mat); }
.rm-bar.asg { background: color-mix(in srgb, var(--s-asg) 22%, var(--surface)); }
.rm-bar.asg > i { background: var(--s-asg); }
.rm-bar.done { opacity: .5; }
.rm-line { position: absolute; top: 19px; height: 4px; border-radius: 2px; background: var(--line); }
.rm-line > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--muted); border-radius: 2px; }
.rm-dia { position: absolute; top: 14px; width: 13px; height: 13px; transform: translateX(-50%) rotate(45deg); border: 2px solid var(--ink); background: var(--surface); padding: 0; border-radius: 2px; cursor: pointer; z-index: 1; }
.rm-dia.goal { background: var(--ink); }
.rm-dia.task { border-color: var(--s-task); }
.rm-dia.task.done { background: var(--s-task); }
.rm-dia.shared { width: 9px; height: 9px; top: 16px; border-width: 1.5px; cursor: default; }
.rm-tag { position: absolute; top: 12px; font-size: 11.5px; color: var(--muted); white-space: nowrap; pointer-events: none; font-family: var(--font-num); }
.rm-legend i { display: inline-block; }
.lg-bar { width: 16px; height: 8px; border-radius: 3px; }
.lg-bar.mat { background: var(--s-mat); } .lg-bar.asg { background: var(--s-asg); }
.lg-dia { width: 9px; height: 9px; transform: rotate(45deg); border: 2px solid var(--ink); border-radius: 1px; }
.lg-dia.goal { background: var(--ink); } .lg-dia.task { border-color: var(--s-task); background: var(--s-task); }
.lg-today { width: 2px; height: 12px; background: var(--ink); }
.lg-off { width: 16px; height: 10px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warn) 35%, transparent) 0 3px, transparent 3px 6px); }
.places { max-height: 230px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding-block: 4px; }
.place { display: flex; align-items: center; gap: 8px; padding-block: 7px; padding-right: 10px; font-size: 14px; cursor: pointer; }
.field .place input { width: 18px; height: 18px; min-height: 0; padding: 0; flex: none; accent-color: var(--accent); }
.todos { display: flex; flex-direction: column; gap: 2px; }
.todo { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.todo-t { overflow-wrap: anywhere; }
.todo.done .todo-t { text-decoration: line-through; color: var(--muted); }
.field .dclear { width: 34px; min-height: 42px; flex: none; font-size: 18px; color: var(--muted); }
.field .row > input { min-width: 0; flex: 1; }
.rm-lab .grip { width: 32px; min-height: 32px; flex: none; }
.rm-lab .grip svg { width: 18px; height: 18px; }
.rm.sorting .rm-row { transition: transform .18s ease; }
.rm.sorting .rm-row.dragging { transition: none; position: relative; z-index: 4; box-shadow: 0 8px 24px rgba(8,14,16,.22); }
.rm.dropping .rm-row { transition: none; }
.selbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); color: var(--accent-ink); display: grid; place-items: center; padding: 0; flex: none; cursor: pointer; }
.selbox.on { background: var(--accent); }
.selbox svg { width: 14px; height: 14px; }
.rm-row.sel .rm-lab, .node.sel { background: var(--accent-soft); }
.selbar { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(8,14,16,.10);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; }
.app.selecting { padding-bottom: calc(200px + env(safe-area-inset-bottom, 0px)); }
.subj-row { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.subj-row > * { flex: none; }
textarea.mig { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; font-family: var(--font-num); font-size: 12px; resize: vertical; }
html, body { height: 100%; }
body {
  background-color: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
/* 横画面や広い画面では幅を広く使う。ロードマップのタブは画面いっぱい */
@media (orientation: landscape) { .app { max-width: 1100px; } }
.app.wide { max-width: none; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 13px; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--ok); }

.section { display: flex; flex-direction: column; gap: 10px; }
.section > h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.title { font-weight: 700; overflow-wrap: anywhere; }
.crumb { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.day-h { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
.day-h b { color: var(--ink, inherit); }
.day-h .num { margin-left: auto; font-weight: 700; color: var(--accent); }

.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s; }
.bar.done > span { background: var(--ok); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.mark { background: var(--mark-soft); color: var(--ink); }
.pill.mark::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mark); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--warn); border-color: var(--warn); background: transparent; }
.btn.danger.armed { background: var(--warn); color: var(--surface); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.icon { width: 36px; min-height: 36px; padding: 0; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
svg { width: 18px; height: 18px; flex: none; }

/* 今日 */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.ring { width: 72px; height: 72px; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .4s; }
.ring text { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 600; }
.treemark { display: flex; flex-direction: column; align-items: center; gap: 0; width: 78px; }
.treemark svg { width: 70px; height: 70px; }
.treemark svg * { transition: fill .6s, stroke .6s; }
.treemark .pctl { font-family: var(--font-num); font-weight: 600; font-size: 15px; line-height: 1.2; }
.quota { display: flex; align-items: baseline; gap: 4px; }
.quota b { font-family: var(--font-num); font-size: 26px; font-weight: 600; line-height: 1; }
.quota .of { font-family: var(--font-num); color: var(--muted); }
.mat.met { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.night { border: 1px solid var(--mark); background: var(--mark-soft); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.night svg { color: var(--mark); margin-top: 2px; }

.check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; flex: none; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check svg { width: 14px; height: 14px; }
.task.done .title { text-decoration: line-through; color: var(--muted); }

/* ツリー */
.tree { display: flex; flex-direction: column; gap: 2px; }
.node { display: grid; grid-template-columns: 24px 22px 1fr auto; align-items: center; gap: 6px; padding: 8px 6px; border-radius: 10px; min-width: 0; }
.node:hover { background: color-mix(in srgb, var(--accent-soft) 50%, transparent); }
.node .tw { width: 24px; height: 24px; border: 0; background: transparent; padding: 0; display: grid; place-items: center; color: var(--muted); }
.node .tw svg { transition: transform .15s; }
.node .tw.open svg { transform: rotate(90deg); }
.node .ic { color: var(--accent); display: grid; place-items: center; }
.node .ic.material { color: var(--mark); }
.node .main { min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.node .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.node .pct { font-family: var(--font-num); font-size: 12px; color: var(--muted); min-width: 3.2em; text-align: right; }
.kids { border-left: 1.5px dashed var(--line); margin-left: 17px; padding-left: 4px; }
.addbtn { width: 32px; min-height: 32px; color: var(--accent); }
.node .meta .pill { white-space: normal; max-width: 100%; }
.addbtn svg { width: 16px; height: 16px; }

/* 課題 */
.due { font-family: var(--font-num); font-weight: 600; font-size: 13px; text-align: center; min-width: 52px; padding: 6px 4px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); line-height: 1.2; }
.due small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 10.5px; }
.due.soon { background: var(--warn-soft); color: var(--warn); }

/* タブ */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { border: 0; background: transparent; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }

/* シート */
.scrim { position: fixed; inset: 0; background: rgba(8,14,16,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0; font-size: 18px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; min-height: 42px; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 8px 4px; font-weight: 700; font-size: 13.5px; border-left: 1px solid var(--line); line-height: 1.3; }
.seg button:first-child { border-left: 0; }

}
/* ホーム画面から全画面で開いたとき：画面上のノッチ・時計の下から始める */
.app { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }

<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <div class="sub" id="today-label"></div>
      <h1 id="view-title">今日</h1>
    </div>
    <span class="sync" id="sync"><i></i><span>読み込み中…</span></span>
  </header>
  <main id="view" class="stack" style="gap:20px"></main>
</div>
<nav class="tabs" aria-label="画面の切り替え"><div class="in" id="tabs"></div></nav>
<div id="sheet-root"></div>

<script>
// ---------- アイコン ----------
const ICONS = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="m9 15 2 2 4-4"/></svg>',

  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  goal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  material: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 2h13v-4"/><path d="M9 8h6"/></svg>',
  task: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>',
  log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
};
function icon(name, cls) { const s = document.createElement('span'); s.className = cls || ''; s.style.display = 'inline-grid'; s.innerHTML = ICONS[name]; return s; }

// ---------- DOM ヘルパー ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'value') el.value = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : String(c)); }
  return el;
}
let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}

// ---------- 日付 ----------
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => fmt(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const dow = s => parse(s).getDay();
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const mdw = s => `${md(s)}（${DOW[dow(s)]}）`;

// ---------- 状態と保存 ----------
const state = { nodes: {}, asgs: {}, settings: { offRanges: [], nightHour: 21 }, ready: false };
const asgProg = a => a.done ? 100 : Math.min(100, Math.max(0, Number(a.progress) || 0)); // 課題の達成度（%）
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const store = {
  mode: 'local', col: null, chains: {},
  queue(id, fn) {
    this.chains[id] = (this.chains[id] || Promise.resolve()).then(fn).catch(e => { console.error(e); toast('保存できませんでした。通信を確認してもう一度試してください'); });
  },
  put(doc) { // doc: { id, kind, ... }
    const before = completeSet(); applyDoc(doc); markNewlyDone(before); render(); scheduleSplit();
    const { id, ...body } = doc;
    if (this.mode === 'sync') this.queue(id, () => this.col.doc(id).set(body)); else saveLocal();
  },
  patch(id, part) {
    const cur = findDoc(id); if (!cur) return;
    part = withWork(cur, part);
    const before = completeSet(); applyDoc(deepMerge(structuredClone(cur), part)); markNewlyDone(before); render(); scheduleSplit();
    if (this.mode === 'sync') this.queue(id, () => this.col.doc(id).update(part)); else saveLocal();
  },
  remove(id) {
    delete state.nodes[id]; delete state.asgs[id]; render(); scheduleSplit();
    if (this.mode === 'sync') this.queue(id, () => this.col.doc(id).delete()); else saveLocal();
  },
};
// ---------- やったことの記録（タスク・目標・課題） ----------
// その日に終えた・進めたものを worked[日付] に残す。次の日に progToday が上書きされても記録タブに残るように
const isWorkItem = x => !!x && (x.kind === 'asg' || (x.kind === 'node' && (x.type === 'task' || x.type === 'goal')));
const progOf = x => x.kind === 'asg' ? asgProg(x) : x.done ? 100 : x.type === 'task' && (x.items || []).length ? Math.round(x.items.filter(i => i.done).length / x.items.length * 100) : goalProg(x);
// 保存した印がなくても、完了日（doneOn）や「その日の始めの達成度」（progToday）から分かる分は拾う（前からあるデータ用）
function derivedWork(x, d) {
  if (x.doneOn === d) return true;
  const pt = x.progToday?.date === d ? x.progToday : null;
  return !!pt && (!x.done || !x.doneOn) && progOf(x) > (Number(pt.from) || 0);
}
function workedOn(x, d) {
  if (!isWorkItem(x)) return false;
  if (x.workMin && x.workMin[d] != null) return true;
  if (x.worked && d in x.worked) return !!x.worked[d];
  return derivedWork(x, d);
}
// 見込み時間から出した、その日にかかった時間（自分で入れた時間があればそちらを使う）
function workEst(x, d) {
  const est = Number(x.estMin) || 0; if (!est) return 0;
  if (x.kind === 'node' && x.type === 'goal' && kids(x.id).length && subtreeHasEst(x.id)) return 0; // 中の項目の方で数える
  const pt = x.progToday?.date === d ? x.progToday : null, from = pt ? Number(pt.from) || 0 : 0;
  const to = x.doneOn === d || (x.done && (pt || !x.doneOn)) ? 100 : pt ? progOf(x) : 0;
  return Math.max(0, to - from) / 100 * est;
}
const workMinOf = (x, d) => x.workMin && x.workMin[d] != null ? Number(x.workMin[d]) || 0 : workEst(x, d);
const workItems = d => [...Object.values(state.nodes), ...Object.values(state.asgs)].filter(x => workedOn(x, d));
// 保存の前に：達成度が変わったら「今日の始めの達成度」を覚え、目標の完了日を入れ、今日の印をつけ外しする
function withWork(cur, part) {
  if (!isWorkItem(cur) || !('done' in part || 'progress' in part || 'items' in part)) return part;
  const t = today(), out = { ...part }, before = progOf(cur);
  let next = deepMerge(structuredClone(cur), part);
  if (progOf(next) !== before && next.progToday?.date !== t) out.progToday = { date: t, from: before };
  if (cur.kind === 'node' && cur.type === 'goal' && 'done' in part && !('doneOn' in part)) out.doneOn = part.done ? (cur.doneOn || t) : null;
  next = deepMerge(structuredClone(cur), out);
  const now = derivedWork(next, t), mark = cur.worked?.[t];
  if (now && mark !== true) out.worked = { [t]: true }; else if (!now && mark === true) out.worked = { [t]: false };
  return out;
}

// ---------- 見込み時間の等分 ----------
// 「中のタスクに等分する」をオンにした目標は、見込み時間を中のタスク（直下）の数で割って、各タスクの見込み時間にする
// 割り切れない分は前のタスクから1分ずつ足して、合計が目標の見込み時間と同じになるようにする
const splitTasks = g => kids(g.id).filter(k => k.type === 'task');
function splitShares(total, k) { const out = []; for (let i = 0; i < k; i++) out.push(Math.round(total * (i + 1) / k) - Math.round(total * i / k)); return out; }
let splitQueued = false;
function scheduleSplit() { if (splitQueued) return; splitQueued = true; queueMicrotask(() => { splitQueued = false; reconcileSplits(); }); }
function reconcileSplits() {
  for (const g of Object.values(state.nodes)) {
    if (g.type !== 'goal' || !g.splitEst) continue;
    const ts = splitTasks(g), sh = splitShares(Math.max(0, Number(g.estMin) || 0), ts.length);
    ts.forEach((t, i) => { if ((Number(t.estMin) || 0) !== sh[i]) store.patch(t.id, { estMin: sh[i] }); });
  }
}

// ---------- 完了したものの非表示 ----------
// 完了：チェック済み、または100%（目標・教材）。課題は提出済み
let showDone = false;
try { showDone = localStorage.getItem('show-done') === '1'; } catch {}
const keepVisible = new Set(); // この画面を見ている間に完了したもの。すぐには消さず、タブを移ると隠れる
const isComplete = n => !!n && (n.done || progress(n.id) >= 0.9999);
const hiddenDone = n => !showDone && isComplete(n) && !keepVisible.has(n.id);
const completeSet = () => new Set([...Object.values(state.nodes).filter(isComplete).map(n => n.id), ...Object.values(state.asgs).filter(a => a.done).map(a => 'a:' + a.id)]);
function markNewlyDone(before) {
  for (const n of Object.values(state.nodes)) if (!before.has(n.id) && isComplete(n)) keepVisible.add(n.id);
  for (const a of Object.values(state.asgs)) if (a.done && !before.has('a:' + a.id)) keepVisible.add('a:' + a.id);
}
function deepMerge(a, b) { for (const [k, v] of Object.entries(b)) { if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], v); else a[k] = v; } return a; }
function findDoc(id) { return state.nodes[id] || state.asgs[id] || (id === 'settings' ? { id, kind: 'settings', ...state.settings } : null); }
function applyDoc(doc) {
  if (doc.kind === 'node') state.nodes[doc.id] = doc;
  else if (doc.kind === 'asg') state.asgs[doc.id] = doc;
  else if (doc.kind === 'settings') { const { id, kind, ...s } = doc; state.settings = { offRanges: [], nightHour: 21, ...s }; }
}
function loadDocs(docs) { state.nodes = {}; state.asgs = {}; state.settings = { offRanges: [], nightHour: 21 }; docs.forEach(applyDoc); }
const LS_KEY = 'goal-tree-v1';
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify([...Object.values(state.nodes), ...Object.values(state.asgs), { id: 'settings', kind: 'settings', ...state.settings }])); } catch {}
}
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) loadDocs(JSON.parse(raw)); } catch {} }

const FIREBASE_CONFIG = {
  "apiKey": "AIzaSyDF91VPYO14h7pvYbXyhB6k2kEwacjFVVU",
  "authDomain": "goal-tree-app-a6934.firebaseapp.com",
  "projectId": "goal-tree-app-a6934",
  "storageBucket": "goal-tree-app-a6934.firebasestorage.app",
  "messagingSenderId": "742421850985",
  "appId": "1:742421850985:web:2df7fb71afc22e394a2bf8"
};
let fb = null; // { auth, A: auth の関数, F: firestore の関数, db, user }
async function initStore() {
  const sync = document.getElementById('sync');
  const setSync = (on, text) => { sync.className = 'sync' + (on ? ' on' : ''); sync.lastChild.textContent = text; };
  let unsub = null;
  try {
    const [{ initializeApp }, A, F] = await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'), import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'), import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);
    const app = initializeApp(FIREBASE_CONFIG);
    const auth = A.getAuth(app);
    // オフラインでも開けるように、端末にもデータを残す
    let db;
    try { db = F.initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch { db = F.initializeFirestore(app, { ignoreUndefinedProperties: true }); }
    fb = { auth, A, F, db, user: null };
    A.onAuthStateChanged(auth, user => {
      if (unsub) { unsub(); unsub = null; }
      fb.user = user;
      if (!user) { store.mode = 'login'; state.needLogin = true; state.ready = false; setSync(false, 'ログインしていません'); render(); return; }
      state.needLogin = false;
      const ref = id => F.doc(db, 'users', user.uid, 'docs', id);
      store.mode = 'sync';
      store.col = { doc: id => ({ set: body => F.setDoc(ref(id), body), update: part => F.setDoc(ref(id), part, { merge: true }), delete: () => F.deleteDoc(ref(id)) }) };

      get = () => ({ unit: unit.value.trim(), total: Number(total.value) || 0, initDone: Number(init.value) || 0, start: st.value, end: en.value, endRef, skipDow: skip, log: n.log || {}, totalMin: Math.round(Number(hrs.value) || 0), rounds: Math.max(1, Math.floor(Number(roundsIn.value) || 1)) });

    // 保存。新しく作るときは「追加」ボタンで（auto=false）、すでにある項目は変更するたびに自動で（auto=true）
    const status = h('span', { class: 'hint grow', 'aria-live': 'polite' }, '変更すると自動で保存されます');
    let deleted = false;
    const commit = (auto) => {
      if (deleted || (!isNew && (!state.nodes[n.id] || state.nodes[n.id].type !== type))) return; // 削除や種類の入れ替えのあとは保存しない
      const fail = msg => { if (auto) status.textContent = '保存できません：' + msg; else toast(msg); };
      const t = title.value.trim(); if (!t) return fail('名前を入れてください');
      if (!places.size) return fail('場所を1つ以上選んでください');
      const plist = [...places], primary = plist.includes(n.parent || '') ? (n.parent || '') : plist[0];
      newParent = primary || null;
      const copyTo = plist.filter(x => x !== primary).map(x => x || null);
      const extra = get();
      if (type === 'material' && (!extra.total || !extra.start || !extra.end || extra.end < extra.start)) return fail('全体の量と、開始日・終了日を正しく入れてください');
      const doc = { ...n, id: n.id || uid('n'), kind: 'node', type, parent: newParent, title: t, created: n.created || Date.now(), ...extra };
      if (!isNew && newParent !== (n.parent || null)) {
        doc.order = Date.now(); // 移した先ではいちばん下
        const oldRoot = rootId(n.id), newRoot = newParent ? rootId(newParent) : doc.id;
        if (oldRoot !== newRoot) { // 別の大きな目標へ移したら、共通の期限との連動は外す
          for (const [rf] of REF_FIELDS) doc[rf] = null;
          for (const id of descendants(n.id)) { const x = state.nodes[id], part = {}; for (const [rf] of REF_FIELDS) if (x[rf]) part[rf] = null; if (Object.keys(part).length) store.patch(id, part); }
        }
      }
      if (doc.parent) expanded.add(doc.parent); // 作った目標が見えるように親は開く。作った目標そのものは閉じたまま
      if (type === 'goal') autoShare(doc, 'deadline', 'deadlineRef');
      else if (type === 'material') autoShare(doc, 'end', 'endRef');
      if (isRoot && !doc.parent) propagateDeadlines(doc);
      saveOpen(); store.put(doc); if (!auto) close();
      pruneAutoDeadlines(rootId(doc.id));
      copyTo.forEach(pid => { copySubtree(state.nodes[doc.id], pid); if (pid) expanded.add(pid); });
      if (copyTo.length) { saveOpen(); render(); toast(`${copyTo.length + 1}か所に入れました（コピー ${copyTo.length}つ）`); }
      if (auto) {
        n = state.nodes[doc.id]; // 次の自動保存は、保存したあとの内容をもとにする
        places.clear(); places.add(n.parent || ''); syncPlaces();
        status.textContent = '保存しました';
      }
    };
    const row = h('div', { class: 'btns', style: 'align-items:center' });
    if (isNew) row.append(h('button', { class: 'btn primary', onclick: () => commit(false) }, '追加'));
    else row.append(status, deleteButton(type === 'goal' ? 'この目標と下を全部削除' : '削除', () => { deleted = true; [...descendants(n.id), n.id].forEach(id => store.remove(id)); close(); toast('削除しました'); }));
    if (!isNew && type === 'material' && lapInfo(n).finished) {
      const r = roundsOf(n), span = Math.max(7, diffDays(n.start, n.end) / r);
      out.push(h('div', { class: 'diff small' }, h('div', { class: 'title' }, `${r > 1 ? r + '周' : '1周'}が終わりました`),
        h('div', null, h('button', { class: 'btn primary small', type: 'button', onclick: () => {
          const end = n.end > addDays(today(), 6) ? n.end : addDays(today(), Math.round(span));
          store.patch(n.id, end !== n.end ? { rounds: r + 1, end, endRef: null } : { rounds: r + 1 });
          close(); toast(`${r + 1}周目を追加しました（〜${md(end)}）`);
        } }, `もう1周する（${r + 1}周目）`)),
        h('div', { class: 'muted' }, '終了日が過ぎているときは、1周ぶんの日数だけ延ばします。後からこの画面で変えられます。')));
    }
    if (!isNew && type === 'material') out.push(h('button', { class: 'btn', type: 'button', onclick: () => { close(); openLog(n); } }, '記録と予定表を見る'));
    if (!isNew) out.push(convertRow(n, close, true, () => commit(true))); // 変える前に、編集中の内容を保存
    out.push(row);
    if (isNew) return out;
    return [autoSaveBox(out, () => commit(true), status)];
  });
}
// 編集画面の入力をまとめて見張り、手を止めて少したったら自動で保存する
function autoSaveBox(children, save, status) {
  let timer = null;
  const schedule = () => { clearTimeout(timer); status.textContent = '保存中…'; timer = setTimeout(save, 700); };
  const box = h('div', { class: 'stack', style: 'gap:14px' }, children);
  // 共通の期限のボタンなどが出す（外へ伝わらない）入力も拾えるように、捕まえる段階で受け取る
  box.addEventListener('input', schedule, true);
  box.addEventListener('change', schedule, true);
  box.addEventListener('click', e => { if (e.target.closest('.dows button, .two > button, .seg button, .chip, .dlrow button')) schedule(); }, true);
  return box;
}

// --- 科目をまとめて追加（定期試験など） ---
const SUBJECT_PRESETS = ['電気回路', '電磁気学', '電子回路', 'ディジタル回路', '応用数学', '応用物理', 'プログラミング', '英語', '国語', '社会'];
function openBulk(parent) {
  ensureShared(rootId(parent.id));
  openSheet('科目をまとめて追加', (close) => {
    const ta = h('textarea', { id: 'bulk-names', rows: '7', style: 'min-height:150px', placeholder: '1行に1科目\n例：\n電気回路\n電磁気学\n応用数学' });
    const lines = () => [...new Set(ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean))];
    const existing = new Set(kids(parent.id).map(k => k.title));
    const last = state.settings.lastSubjects || [];
    const chipsBox = h('div', { class: 'chips' });
    const go = h('button', { class: 'btn primary', type: 'button' });
    const draw = () => {
      const cur = new Set(lines());
      chipsBox.replaceChildren(...[...new Set([...last, ...SUBJECT_PRESETS])].map(s => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(cur.has(s)),
        onclick: () => { const ls = lines(); ta.value = (cur.has(s) ? ls.filter(x => x !== s) : [...ls, s]).join('\n'); draw(); } }, s)));
      const add = lines().filter(s => !existing.has(s));
      go.textContent = add.length ? `${add.length}科目を追加` : '追加する科目を入れてください';
      go.disabled = !add.length;
    };
    ta.addEventListener('input', draw);
    const dl = h('input', { id: 'bulk-deadline', type: 'date' });
    let dlRef = null;
    const link = dateLink(dl, null, () => state.nodes[rootId(parent.id)]?.deadlines || [], r => { dlRef = r; });
    go.addEventListener('click', () => {
      const all = lines(), add = all.filter(s => !existing.has(s)); if (!add.length) return;
      const now = Date.now();
      if (dl.value && !dlRef) { // まとめて作る科目の期限も、共通の期限に自動で追加
        const root = state.nodes[rootId(parent.id)];
        if (root) { const { ref, list } = shareDate(root, dl.value, parent.title); if (list) store.patch(root.id, { deadlines: list }); dlRef = ref; }
      }
      add.forEach((title, i) => store.put({ id: uid('n'), kind: 'node', type: 'goal', parent: parent.id, title, start: today(), deadline: dl.value || null, deadlineRef: dlRef, done: false, created: now + i }));
      saveSettings({ lastSubjects: all });
      expanded.add(parent.id); saveOpen(); close();
      const skipped = all.length - add.length;
      toast(`${add.length}科目を追加しました` + (skipped ? `（すでにある${skipped}科目は飛ばしました）` : ''));
    });
    draw();
    return [
      h('div', { class: 'crumb' }, `「${parent.title}」の下に、科目ごとの小さい目標を作ります`),
      field('科目（1行に1つ）', ta),
      h('div', { class: 'field' }, h('span', null, last.length ? 'タップで入れる（前回の科目と、よくある科目）' : 'タップで入れる（よくある科目）'), chipsBox),
      last.length ? h('div', null, h('button', { class: 'btn small', type: 'button', onclick: () => { ta.value = [...new Set([...lines(), ...last])].join('\n'); draw(); } }, `前回の科目（${last.length}つ）をすべて入れる`)) : null,
      h('div', { class: 'stack', style: 'gap:6px' }, field('期限（全部の科目に同じ期限・なくてもOK）', dl), link.el),
      existing.size ? h('p', { class: 'hint', style: 'margin:0' }, 'すでに同じ名前の目標がある科目は、飛ばして追加しません。') : null,
      h('div', { class: 'btns' }, go),
    ];
  });
}

// --- 教材の記録 ---
const LOG_RANGES = { w1: ['1週間', 7], m1: ['1か月', 30] };
let logRange = (() => { try { return LOG_RANGES[localStorage.getItem('log-range')] ? localStorage.getItem('log-range') : 'w1'; } catch { return 'w1'; } })();
function openLog(m) {
  openSheet(m.title, (close) => {
    const pl = plan(m);
    const date = h('input', { id: 'log-date', type: 'date', value: today(), max: today() });
    const amt = h('input', { id: 'log-amt', type: 'number', inputmode: 'numeric', min: '0', value: (m.log || {})[today()] ?? '' });
    date.addEventListener('change', () => { amt.value = (m.log || {})[date.value] ?? ''; });
    const u = m.unit || '', log = { ...(m.log || {}) };
    // 1週間 / 1か月 の切り替え：これまでの記録とこれからの予定を、選んだ日数でまとめて見る
    const tables = h('div', { style: 'display:flex;flex-direction:column;gap:14px;flex-shrink:0' });
    const tbl = (head, rows, empty) => h('div', { class: 'tbl-wrap' }, h('table', null, h('thead', null, h('tr', null, h('th', null, '日付'), h('th', null, head))),
      h('tbody', null, rows.length ? rows : h('tr', null, h('td', { colspan: '2' }, empty)))));
    const fillTables = () => {
      const N = LOG_RANGES[logRange][1], past = [], t = today();
      const days = [...Array(N)].map((_, i) => addDays(t, i - N + 1));
      const total = () => days.reduce((s, d) => s + (Number(log[d]) || 0), 0);
      const pastHead = h('h2', null);
      const setHead = () => { pastHead.textContent = `これまでの記録（${LOG_RANGES[logRange][0]}・合計 ${total()}${u}）`; };
      setHead();
      // 表の中の欄に数字を入れると、その日の記録としてそのまま保存する
      for (const d of days) {
        const inp = h('input', { type: 'number', inputmode: 'numeric', min: '0', class: 'log-cell', value: log[d] ?? '', placeholder: isOff(m, d) ? '休み' : '—', 'aria-label': `${mdw(d)}のやった量` });
        inp.addEventListener('change', () => {
          const v = inp.value === '' ? 0 : Math.max(0, Number(inp.value) || 0);
          log[d] = v; store.patch(m.id, { log: { [d]: v } }); setHead();
          if (d === date.value) amt.value = v || '';
          toast(`${md(d)} を${v}${u}で記録しました`);
        });
        past.push(h('tr', null, h('td', null, mdw(d) + (d === t ? '・今日' : '')), h('td', { class: 'num' }, h('span', { class: 'log-in' }, inp, u))));
      }
      const fut = pl.days.slice(0, N), fsum = fut.reduce((s, x) => s + (x.q || 0), 0);
      tables.replaceChildren(
        h('div', { class: 'section' }, pastHead,
          tbl('やった量', past.reverse(), ''), h('p', { class: 'hint', style: 'margin:0' }, '欄に数字を入れると、その日の記録としてそのまま保存されます（空にすると0）')),
        h('div', { class: 'section' }, h('h2', null, `これからの予定（${LOG_RANGES[logRange][0]}・合計 ${fsum}${u}）`),
          tbl('量', fut.map(x => h('tr', null, h('td', null, mdw(x.d)), h('td', { class: 'num' + (x.w ? '' : ' off') }, x.off ? '休み' : x.q + u))), '予定はありません'),
          h('p', { class: 'hint', style: 'margin:0' }, '記録に合わせて自動で変わります')));
    };
    const rangeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': '記録を見る期間', style: 'flex-shrink:0' },
      Object.entries(LOG_RANGES).map(([k, [l]]) => h('button', { type: 'button', 'aria-pressed': String(logRange === k), onclick: e => {
        logRange = k; try { localStorage.setItem('log-range', k); } catch {}
        e.currentTarget.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === e.currentTarget))); fillTables(); } }, l)));
    fillTables();
    return [
      h('div', { class: 'crumb' }, path(m.id)),
      h('div', { class: 'diff' }, h('div', null, '進み具合：', h('b', { class: 'num' }, lapText(m)), roundsOf(m) > 1 ? h('span', { class: 'muted' }, `（${roundsOf(m)}周のうち、全体 ${doneTotal(m)}/${grand(m)}${m.unit || ''}）`) : null), bar(progress(m.id))),
      h('div', { class: 'two' }, field('日付', date), field(`やった量（${m.unit || ''}）`, amt)),
      h('div', { class: 'btns' },
        h('button', { class: 'btn primary', onclick: () => { const v = Math.max(0, Number(amt.value) || 0); log[date.value || today()] = v; store.patch(m.id, { log: { [date.value || today()]: v } }); close(); toast('記録しました'); } }, '記録する'),
        date.value === today() && pl.todayQ ? h('button', { class: 'btn', onclick: () => { amt.value = pl.todayQ; } }, `今日のノルマ（${pl.todayQ}）を入れる`) : null),
      rangeSeg, tables,
      h('button', { class: 'btn ghost', onclick: () => { close(); openNode(m); } }, '教材の設定を変える'),
      convertRow(m, close),
    ];
  });
}

// --- 課題の追加・編集 ---
function openAsg(a) {
  const isNew = !a;
  a = a || { progress: 0, start: today(), due: addDays(today(), 7) };
  openSheet(isNew ? '課題を追加' : '課題を編集', (close) => {
    const title = h('input', { id: 'a-title', value: a.title || '', placeholder: '例：電気回路 レポート' });
    const subject = h('input', { id: 'a-subject', value: a.subject || '', placeholder: '例：電気回路Ⅱ' });
    const st = h('input', { id: 'a-start', type: 'date', value: a.start });
    const due = h('input', { id: 'a-due', type: 'date', value: a.due });
    const memo = h('textarea', { id: 'a-memo', placeholder: '提出方法、ページ数など' }, a.memo || '');
    const ahrs = h('input', { id: 'a-hours', type: 'number', inputmode: 'numeric', min: '0', step: '5', value: a.estMin || '', placeholder: '例：180' });
    let progress = Math.min(100, Math.max(0, Number(a.progress) || 0));
    const form = [
      field('課題名', title), field('科目（なくてもOK）', subject),
      h('div', { class: 'two' }, field('取りかかる日', st), field('〆切', due)),
      progressField(progress, v => progress = v),
      field('かかる時間の見込み（分・なくてもOK）', ahrs, '残りの時間（見込み × まだの割合）を、〆切まで毎日同じだけ割り振って予測します'),
      field('メモ', memo),
    ];
    const status = h('span', { class: 'hint grow', 'aria-live': 'polite' }, '変更すると自動で保存されます');
    let deleted = false;
    const commit = (auto) => {
      if (deleted || (!isNew && !state.asgs[a.id])) return;
      const fail = msg => { if (auto) status.textContent = '保存できません：' + msg; else toast(msg); };
      const t = title.value.trim(); if (!t) return fail('課題名を入れてください');
      if (!st.value || !due.value || due.value < st.value) return fail('取りかかる日と〆切を正しく入れてください');
      const { weight, ...rest } = a; // 以前の「重さ」は使わない
      const doc = { ...rest, id: a.id || uid('a'), kind: 'asg', title: t, subject: subject.value.trim(), start: st.value, due: due.value, progress, estMin: Math.round(Number(ahrs.value) || 0), memo: memo.value, done: !!a.done, created: a.created || Date.now() };
      if (!isNew && progress !== (Number(a.progress) || 0)) doc.progToday = a.progToday?.date === today() ? a.progToday : { date: today(), from: asgProg(a) };
      store.put(doc);
      if (auto) { a = state.asgs[doc.id]; status.textContent = '保存しました'; }
      else { close(); toast('課題を追加しました'); }
    };
    const buttons = h('div', { class: 'btns', style: 'align-items:center' });
    if (isNew) { buttons.append(h('button', { class: 'btn primary', onclick: () => commit(false) }, '追加')); return [...form, buttons]; }
    buttons.append(status, deleteButton('削除', () => { deleted = true; store.remove(a.id); close(); toast('削除しました'); }));
    return [autoSaveBox([...form, buttons], () => commit(true), status)];
  });
}
